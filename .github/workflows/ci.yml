name: CI

on:
  pull_request:
  push:
    branches-ignore: [state]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install Hunspell (lt_LT)
        run: sudo apt-get update -q && sudo apt-get install -y -q hunspell hunspell-lt hunspell-en-us
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Fixture dry run (no API calls)
        run: >
          npm run -s pipeline -- article --topic "ExampleVideo 2.0 (testas)" --type news
          --cluster di-irankiai --keyword "AI video įrankis"
          --site test/fixtures/site --fixtures test/fixtures/article --dry-run --out out/fixture
