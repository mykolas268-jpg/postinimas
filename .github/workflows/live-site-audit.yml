name: Live site audit

# Runs docs/live-site-check.sh from a GitHub runner (open internet) and keeps
# the output as an artifact. Read-only: GET/HEAD requests only.

on:
  workflow_dispatch:
    inputs:
      base:
        description: Base URL
        default: https://verslas.ai
  push:
    paths:
      - docs/live-site-check.sh
      - .github/workflows/live-site-audit.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Run live checks
        env:
          BASE: ${{ inputs.base || 'https://verslas.ai' }}
        run: |
          case "$BASE" in https://*) ;; *) echo "::error::base must be an https URL"; exit 1;; esac
          bash docs/live-site-check.sh "$BASE" | tee live-check.txt
      - uses: actions/upload-artifact@v6
        with:
          name: live-check
          path: live-check.txt
